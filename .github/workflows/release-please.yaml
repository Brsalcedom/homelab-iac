on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: simple

  # Tags the current docs image with the release version. Runs here because
  # tags created with GITHUB_TOKEN don't trigger other workflows.
  docs-image:
    name: "🏷️ Tag docs image"
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Self-hosted runner on the LAN, the only one that reaches zot.
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    env:
      MAJOR: ${{ needs.release-please.outputs.major }}
      MINOR: ${{ needs.release-please.outputs.minor }}
      PATCH: ${{ needs.release-please.outputs.patch }}

    steps:
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Get secrets from Bitwarden
        uses: bitwarden/sm-action@v3.0.1
        id: secrets-bw
        with:
          access_token: ${{ secrets.BW_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            ca9951e3-7c49-4c0d-a57c-b4e7011bdae8 > ZOT_PUSH_PASSWORD

      - name: 🔐 Login to zot
        uses: docker/login-action@v4
        with:
          registry: zot.home.cervant.net
          username: homelab-ci-push
          password: ${{ steps.secrets-bw.outputs.ZOT_PUSH_PASSWORD }}

      - name: 🛠️ Setup Buildx
        uses: docker/setup-buildx-action@v4

      # Copies the :latest manifest to X.Y.Z, X.Y and X in each registry,
      # without rebuilding, so the tags point at the same digest.
      - name: 🏷️ Tag X.Y.Z, X.Y and X
        run: |
          for image in ghcr.io/brsalcedom/homelab-docs zot.home.cervant.net/homelab-docs; do
            docker buildx imagetools create \
              --tag "$image:$MAJOR.$MINOR.$PATCH" \
              --tag "$image:$MAJOR.$MINOR" \
              --tag "$image:$MAJOR" \
              "$image:latest"
          done
