apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    tier: platform
    domain: observability
    source: multi
    exposure: internal
    criticality: standard
    image-updates: disabled
  annotations:
    # With ServerSideApply, a client-side diff flags the defaults the API server
    # fills in (HTTPRoute backendRef weight, InfisicalSecret secretType) as drift.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    # After the Infisical operator (wave 2), which provides the InfisicalSecret CRD.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.11.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/kubernetes/applications/argocd/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/Brsalcedom/homelab-iac.git
      targetRevision: main
      path: kubernetes/applications/argocd/kube-prometheus-stack/manifests
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus Operator CRDs are too big for client-side apply.
      - ServerSideApply=true
      # On a fresh cluster the PodMonitor in manifests/ is applied in the same
      # sync that creates its CRD.
      - SkipDryRunOnMissingResource=true
