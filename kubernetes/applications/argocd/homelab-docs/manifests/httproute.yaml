apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homelab-docs
  namespace: homelab-docs
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: cilium-gateway
      sectionName: https
  hostnames:
    - docs.home.cervant.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: homelab-docs
          port: 80
