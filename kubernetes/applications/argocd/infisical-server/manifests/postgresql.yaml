apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: infisical-postgresql
  annotations:
    # Ready before the Infisical Deployment, which reads infisical-postgresql-app.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: infisical
      owner: infisical
  storage:
    size: 2Gi
    storageClass: local-path
