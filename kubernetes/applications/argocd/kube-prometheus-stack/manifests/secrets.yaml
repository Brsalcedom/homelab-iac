apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: grafana-secrets
  namespace: monitoring
spec:
  resyncInterval: 300
  authentication:
    kubernetesAuth:
      identityId: c27d3730-f918-463d-8470-07eea18f40bd
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: hyperion-8-jio
        envSlug: prod
        secretsPath: "/"
  managedKubeSecretReferences:
    - secretName: grafana-secrets
      secretNamespace: monitoring
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          # Break-glass local admin (grafana.admin.existingSecret).
          admin-user: admin
          admin-password: "{{ .grafana_admin_password.Value }}"
          # Pocket ID client (auth.generic_oauth), passed in as GF_AUTH_GENERIC_OAUTH_* env.
          oidc-client-id: "{{ .grafana_oidc_client_id.Value }}"
          oidc-client-secret: "{{ .grafana_oidc_client_secret.Value }}"
