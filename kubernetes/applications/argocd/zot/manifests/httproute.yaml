apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot-route
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: cilium-gateway
      sectionName: "https"
  hostnames:
    - "zot.home.cervant.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Envoy's default 15s route timeout cuts large layer pushes.
      timeouts:
        request: 0s
      backendRefs:
        - name: zot
          port: 5000
