# Loki as a single binary on the local filesystem. Logs are pushed by Alloy
# and queried from Grafana at http://loki.monitoring.svc.cluster.local:3100.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 336h # 14d
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    size: 20Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# The simple scalable targets stay at zero in SingleBinary mode.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Caches, the nginx gateway and the canary are meant for bigger installs.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
