# Read-only credentials for zot.home.cervant.net, from the homelab-cd-pull
# htpasswd user. zot_pull_auth holds base64("homelab-cd-pull:<password>").
#
# Two copies: the kubelet reads the one in homelab-docs, and ArgoCD Image
# Updater can only read Secrets in its own namespace (argocd).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: zot-pull
  namespace: homelab-docs
spec:
  resyncInterval: 300
  authentication:
    kubernetesAuth:
      identityId: c27d3730-f918-463d-8470-07eea18f40bd
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: hyperion-8-jio
        envSlug: prod
        secretsPath: "/"
  managedKubeSecretReferences:
    - secretName: zot-pull
      secretNamespace: homelab-docs
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          .dockerconfigjson: '{"auths":{"zot.home.cervant.net":{"auth":"{{ .zot_pull_auth.Value }}"}}}'
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: zot-pull-homelab-docs
  namespace: argocd
spec:
  resyncInterval: 300
  authentication:
    kubernetesAuth:
      identityId: c27d3730-f918-463d-8470-07eea18f40bd
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: hyperion-8-jio
        envSlug: prod
        secretsPath: "/"
  managedKubeSecretReferences:
    - secretName: zot-pull-homelab-docs
      secretNamespace: argocd
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          .dockerconfigjson: '{"auths":{"zot.home.cervant.net":{"auth":"{{ .zot_pull_auth.Value }}"}}}'
