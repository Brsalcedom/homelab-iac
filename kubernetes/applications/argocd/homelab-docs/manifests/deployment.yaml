apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-docs
  namespace: homelab-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-docs
  template:
    metadata:
      labels:
        app: homelab-docs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: zot-pull
      containers:
        - name: nginx
          # ArgoCD Image Updater (imageupdater.yaml) overrides this with the
          # digest of :latest each time CI pushes a new image.
          image: zot.home.cervant.net/homelab-docs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
