name: "Docs"

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "terraform/**/*.tf"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brsalcedom/homelab-docs
  TERRAFORM_DOCS_VERSION: v0.24.0

jobs:
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v7

      - name: 📚 Generate Terraform reference
        working-directory: .
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs

          # terraform-docs resolves --output-file relative to the module dir.
          gen() {
            out=$(realpath --relative-to="$1" "docs/src/content/docs/reference/terraform-$2.md")
            /tmp/terraform-docs --config "$PWD/docs/.terraform-docs.yml" \
              --output-file "$out" --output-mode inject "$1"
          }
          gen terraform/proxmox/vm vm
          gen terraform/proxmox/lxc lxc
          gen terraform/proxmox/infraestructure/hyperion hyperion

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: 📦 Install
        run: npm ci

      - name: 🔨 Build
        run: npm run build

      - name: 📤 Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 1

  cloudflare:
    name: "☁️ Deploy docs.cervant.net"
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download dist
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs/dist

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: 📦 Install
        run: npm ci

      - name: 🔐 Get secrets from Bitwarden
        uses: bitwarden/sm-action@v3.0.1
        id: secrets-bw
        with:
          access_token: ${{ secrets.BW_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            5f799dd8-c81f-4b66-b6d9-b4e100f7d60d > CLOUDFLARE_WORKERS_API_TOKEN
            100abb60-0ac5-4c3b-99d8-b4e100f8220f > CLOUDFLARE_ACCOUNT_ID

      - name: 🚀 wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.secrets-bw.outputs.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.secrets-bw.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  image:
    name: "🐳 Publish image"
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download dist
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs/dist

      - name: 🏷️ Compute tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📦 Build & push
        uses: docker/build-push-action@v7
        with:
          context: docs
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=homelab-iac docs (Starlight) served by nginx
