# Uptime, latency and certificate expiry for the homelab endpoints. Each entry
# in serviceMonitor.targets becomes a ServiceMonitor that Prometheus scrapes
# through /probe.

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: "ip4"
    # Proxmox serves its own self-signed certificate.
    http_2xx_insecure:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: "ip4"
        tls_config:
          insecure_skip_verify: true
    # Pi-hole answers for home.cervant.net with the right address.
    dns_home:
      prober: dns
      timeout: 5s
      dns:
        query_name: hyperion-01.home.cervant.net
        query_type: A
        preferred_ip_protocol: "ip4"
        valid_rcodes: ["NOERROR"]
        validate_answer_rrs:
          fail_if_none_matches_regexp:
            - ".*\\s192\\.168\\.10\\.201$"

serviceMonitor:
  enabled: true
  defaults:
    interval: 60s
    scrapeTimeout: 10s
  targets:
    - name: argocd
      url: https://argocd.home.cervant.net
    - name: pocket-id
      url: https://pocket.home.cervant.net
    - name: infisical
      url: https://infisical.home.cervant.net
    - name: docs
      url: https://docs.home.cervant.net
    - name: zot
      url: https://zot.home.cervant.net
    - name: grafana
      url: https://grafana.home.cervant.net/api/health
    - name: pihole
      url: https://pihole.home.cervant.net/admin/
    - name: proxmox
      url: https://192.168.10.131:8006
      module: http_2xx_insecure
    - name: pihole-dns
      url: 192.168.10.150:53
      module: dns_home

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    memory: 64Mi
