# Identity used by InfisicalSecret resources for Kubernetes Auth. The operator
# requests short-lived tokens for it (autoCreateServiceAccountToken).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-auth
  namespace: infisical-operator-system
---
# The Kubernetes Auth identity has no token reviewer JWT, so Infisical reviews
# each token with the token itself; this SA must be allowed to call TokenReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-auth-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: infisical-auth
    namespace: infisical-operator-system
