# Pocket ID clients for ArgoCD, read by oidc.config in argocd.tf as
# $argocd-oidc:<key>. ArgoCD only resolves those references from Secrets
# labeled app.kubernetes.io/part-of: argocd.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  resyncInterval: 300
  authentication:
    kubernetesAuth:
      identityId: c27d3730-f918-463d-8470-07eea18f40bd
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: hyperion-8-jio
        envSlug: prod
        secretsPath: "/"
  managedKubeSecretReferences:
    - secretName: argocd-oidc
      secretNamespace: argocd
      creationPolicy: Owner
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: argocd
        includeAllSecrets: false
        data:
          # Confidential client, used by the UI.
          clientID: "{{ .argocd_oidc_client_id.Value }}"
          clientSecret: "{{ .argocd_oidc_client_secret.Value }}"
          # Public client (PKCE), used by `argocd login --sso`.
          cliClientID: "{{ .argocd_cli_oidc_client_id.Value }}"
