services:
  agent:
    image: portainer/agent:2.39.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    ports:
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host
    networks:
      - portainer_agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ce:2.39.5
    command: -H tcp://tasks.portainer_agent:9001 --tlsskipverify
    ports:
      - target: 9443
        published: 9443
        mode: host
      - target: 9000
        published: 9000
        mode: host
      - target: 8000
        published: 8000
        mode: host
    volumes:
      - portainer_data:/data
    networks:
      - portainer_agent_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  portainer_agent_network:
    driver: overlay
    attachable: true

volumes:
  portainer_data: