apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: zot-secrets
  namespace: zot
spec:
  resyncInterval: 300
  authentication:
    kubernetesAuth:
      identityId: c27d3730-f918-463d-8470-07eea18f40bd
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: hyperion-8-jio
        envSlug: prod
        secretsPath: "/"
  managedKubeSecretReferences:
    - secretName: zot-secrets
      secretNamespace: zot
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          htpasswd: "{{ .zot_htpasswd.Value }}"
          # Pocket ID client for the zot UI (http.auth.openid).
          oidc-credentials.json: '{"clientid":"{{ .zot_oidc_client_id.Value }}","clientsecret":"{{ .zot_oidc_client_secret.Value }}"}'
          # Fixed keys so UI sessions survive restarts (http.auth.sessionKeysFile).
          session-keys.json: '{"hashKey":"{{ .zot_session_hash_key.Value }}","encryptKey":"{{ .zot_session_encrypt_key.Value }}"}'
